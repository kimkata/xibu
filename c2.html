<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>当前经纬度坐标转换</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f7f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-size: 1.5rem;
        }
        .coord-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .coord-info h3 {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 5px;
        }
        .coord-info p {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e293b;
            word-break: break-all;
        }
        .copy-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
            margin-left: 10px;
            transition: background 0.2s;
        }
        .copy-btn:hover { background: #2563eb; }
        .copy-btn.copied { background: #10b981; }
        
        .status {
            text-align: center;
            margin-top: 15px;
            color: #64748b;
            font-size: 0.9rem;
            min-height: 1.2em;
        }
        .error { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>📍 当前坐标信息</h2>
    
    <div class="coord-item">
        <div class="coord-info">
            <h3>WGS84 (GPS标准)</h3>
            <p id="wgs84">获取中...</p>
        </div>
        <button class="copy-btn" onclick="copyCoord('wgs84', this)">复制</button>
    </div>

    <div class="coord-item">
        <div class="coord-info">
            <h3>GCJ02 (国测局/高德/腾讯)</h3>
            <p id="gcj02">获取中...</p>
        </div>
        <button class="copy-btn" onclick="copyCoord('gcj02', this)">复制</button>
    </div>

    <div class="coord-item">
        <div class="coord-info">
            <h3>BD09 (百度)</h3>
            <p id="bd09">获取中...</p>
        </div>
        <button class="copy-btn" onclick="copyCoord('bd09', this)">复制</button>
    </div>

    <div id="status" class="status">正在请求定位权限...</div>
</div>

<script>
    // 坐标转换核心算法
    const PI = Math.PI;
    const A = 6378245.0; // 长半轴
    const EE = 0.00669342162296594323; // 偏心率平方

    function transformLat(lng, lat) {
        let ret = -100.0 + 2.0 * lng + 3.0 * lat + 0.2 * lat * lat + 0.1 * lng * lat + 0.2 * Math.sqrt(Math.abs(lng));
        ret += (20.0 * Math.sin(6.0 * lng * PI) + 20.0 * Math.sin(2.0 * lng * PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(lat * PI) + 40.0 * Math.sin(lat / 3.0 * PI)) * 2.0 / 3.0;
        ret += (160.0 * Math.sin(lat / 12.0 * PI) + 320 * Math.sin(lat * PI / 30.0)) * 2.0 / 3.0;
        return ret;
    }

    function transformLng(lng, lat) {
        let ret = 300.0 + lng + 2.0 * lat + 0.1 * lng * lng + 0.1 * lng * lat + 0.1 * Math.sqrt(Math.abs(lng));
        ret += (20.0 * Math.sin(6.0 * lng * PI) + 20.0 * Math.sin(2.0 * lng * PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(lng * PI) + 40.0 * Math.sin(lng / 3.0 * PI)) * 2.0 / 3.0;
        ret += (150.0 * Math.sin(lng / 12.0 * PI) + 300.0 * Math.sin(lng / 30.0 * PI)) * 2.0 / 3.0;
        return ret;
    }

    // WGS84 转 GCJ02
    function wgs84ToGcj02(lng, lat) {
        let dlat = transformLat(lng - 105.0, lat - 35.0);
        let dlng = transformLng(lng - 105.0, lat - 35.0);
        const radlat = lat / 180.0 * PI;
        let magic = Math.sin(radlat);
        magic = 1 - EE * magic * magic;
        const sqrtmagic = Math.sqrt(magic);
        dlat = (dlat * 180.0) / ((A * (1 - EE)) / (magic * sqrtmagic) * PI);
        dlng = (dlng * 180.0) / (A / sqrtmagic * Math.cos(radlat) * PI);
        const mglat = lat + dlat;
        const mglng = lng + dlng;
        return [mglng, mglat];
    }

    // GCJ02 转 BD09
    function gcj02ToBd09(lng, lat) {
        const z = Math.sqrt(lng * lng + lat * lat) + 0.00002 * Math.sin(lat * PI * 3000.0 / 180.0);
        const theta = Math.atan2(lat, lng) + 0.000003 * Math.cos(lng * PI * 3000.0 / 180.0);
        const bd_lng = z * Math.cos(theta) + 0.0065;
        const bd_lat = z * Math.sin(theta) + 0.006;
        return [bd_lng, bd_lat];
    }

    // 格式化坐标
    function formatCoord(lng, lat) {
        return `${lng.toFixed(6)}, ${lat.toFixed(6)}`;
    }

    // 复制到剪贴板
    async function copyCoord(id, btn) {
        const text = document.getElementById(id).innerText;
        if (!text || text.includes('获取中') || text.includes('失败')) return;

        try {
            await navigator.clipboard.writeText(text);
            const originalText = btn.innerText;
            btn.innerText = '已复制';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('copied');
            }, 1500);
        } catch (err) {
            alert('复制失败，请手动选择复制');
        }
    }

    // 获取定位并计算
    async function initLocation() {
        const statusEl = document.getElementById('status');
        const wgs84El = document.getElementById('wgs84');
        const gcj02El = document.getElementById('gcj02');
        const bd09El = document.getElementById('bd09');

        if (!navigator.geolocation) {
            statusEl.innerHTML = '<span class="error">您的浏览器不支持地理定位</span>';
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const wgsLng = position.coords.longitude;
                const wgsLat = position.coords.latitude;

                // 1. WGS84
                wgs84El.innerText = formatCoord(wgsLng, wgsLat);

                // 2. GCJ02
                const [gcjLng, gcjLat] = wgs84ToGcj02(wgsLng, wgsLat);
                gcj02El.innerText = formatCoord(gcjLng, gcjLat);

                // 3. BD09
                const [bdLng, bdLat] = gcj02ToBd09(gcjLng, gcjLat);
                bd09El.innerText = formatCoord(bdLng, bdLat);

                statusEl.innerText = '定位成功，数据已更新';
            },
            (error) => {
                let msg = '定位失败';
                switch(error.code) {
                    case error.PERMISSION_DENIED: msg = '用户拒绝了定位请求，请在浏览器设置中允许'; break;
                    case error.POSITION_UNAVAILABLE: msg = '位置信息不可用'; break;
                    case error.TIMEOUT: msg = '定位请求超时'; break;
                }
                statusEl.innerHTML = `<span class="error">${msg}</span>`;
                wgs84El.innerText = '获取失败';
                gcj02El.innerText = '获取失败';
                bd09El.innerText = '获取失败';
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    }

    // 页面加载完成后执行
    window.onload = initLocation;
</script>

</body>
</html>
